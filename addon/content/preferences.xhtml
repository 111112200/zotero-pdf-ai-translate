<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>

<groupbox>
  <label><html:h2 data-l10n-id="pdfaitranslate-pref-service"></html:h2></label>
  <html:p
    data-l10n-id="pdfaitranslate-pref-service-desc"
    style="margin: 0 0 8px 0; opacity: 0.75; max-width: 40em;"
  ></html:p>

  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-provider"
      data-l10n-id="pdfaitranslate-pref-provider"
      style="min-width: 11em;"
    ></html:label>
    <menulist
      id="zotero-prefpane-__addonRef__-provider"
      native="true"
      preference="activeProviderId"
      oncommand="Zotero.__addonInstance__.hooks.onPrefsEvent('providerChanged', { window })"
      style="min-width: 22em;"
    >
      <menupopup id="__addonRef__-provider-popup" />
    </menulist>
  </hbox>

  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-baseurl"
      data-l10n-id="pdfaitranslate-pref-baseurl"
      style="min-width: 11em;"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-baseurl"
      preference="baseURL"
      style="min-width: 30em;"
    ></html:input>
  </hbox>

  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-apikey"
      data-l10n-id="pdfaitranslate-pref-apikey"
      style="min-width: 11em;"
    ></html:label>
    <html:input
      type="password"
      id="zotero-prefpane-__addonRef__-apikey"
      preference="apiKey"
      style="min-width: 30em;"
    ></html:input>
  </hbox>

  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-model"
      data-l10n-id="pdfaitranslate-pref-model"
      style="min-width: 11em;"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-model"
      preference="model"
      style="min-width: 30em;"
    ></html:input>
    <button
      id="zotero-prefpane-__addonRef__-test"
      data-l10n-id="pdfaitranslate-pref-test"
      oncommand="Zotero.__addonInstance__.hooks.onPrefsEvent('testConnection', { window })"
    />
  </hbox>

  <vbox id="__addonRef__-test-result" style="margin-inline-start: 11em;" />
</groupbox>

<groupbox>
  <label><html:h2 data-l10n-id="pdfaitranslate-pref-language"></html:h2></label>
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-sourcelang"
      data-l10n-id="pdfaitranslate-pref-sourcelang"
      style="min-width: 11em;"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-sourcelang"
      preference="sourceLang"
      style="min-width: 10em;"
    ></html:input>
  </hbox>
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-targetlang"
      data-l10n-id="pdfaitranslate-pref-targetlang"
      style="min-width: 11em;"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-targetlang"
      preference="targetLang"
      style="min-width: 10em;"
    ></html:input>
  </hbox>
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-firstpage"
      data-l10n-id="pdfaitranslate-pref-pagerange"
      style="min-width: 11em;"
    ></html:label>
    <html:input
      type="number"
      min="0"
      id="zotero-prefpane-__addonRef__-firstpage"
      preference="firstPage"
      style="width: 5em;"
    ></html:input>
    <html:span style="margin: 0 6px;">–</html:span>
    <html:input
      type="number"
      min="0"
      id="zotero-prefpane-__addonRef__-lastpage"
      preference="lastPage"
      style="width: 5em;"
    ></html:input>
    <html:span
      data-l10n-id="pdfaitranslate-pref-pagerange-hint"
      style="margin-inline-start: 8px; opacity: 0.75;"
    ></html:span>
  </hbox>
  <hbox align="start">
    <html:label
      for="zotero-prefpane-__addonRef__-prompt"
      data-l10n-id="pdfaitranslate-pref-prompt"
      style="min-width: 11em;"
    ></html:label>
    <html:textarea
      id="zotero-prefpane-__addonRef__-prompt"
      data-pref="systemPromptExtra"
      rows="3"
      style="width: 32em;"
    ></html:textarea>
  </hbox>
  <html:p
    data-l10n-id="pdfaitranslate-pref-prompt-hint"
    style="margin: 2px 0 8px 11em; opacity: 0.7;"
  ></html:p>
</groupbox>

<groupbox>
  <label><html:h2 data-l10n-id="pdfaitranslate-pref-glossary"></html:h2></label>
  <html:p
    data-l10n-id="pdfaitranslate-pref-glossary-hint"
    style="margin: 0 0 6px 0; opacity: 0.75; max-width: 42em;"
  ></html:p>
  <html:textarea
    id="zotero-prefpane-__addonRef__-glossary"
    data-pref="glossary"
    rows="5"
    style="width: 34em; font-family: monospace;"
  ></html:textarea>
</groupbox>

<groupbox>
  <label><html:h2 data-l10n-id="pdfaitranslate-pref-layout"></html:h2></label>
  <hbox align="center">
    <checkbox
      id="zotero-prefpane-__addonRef__-originalleft"
      native="true"
      preference="originalOnLeft"
      data-l10n-id="pdfaitranslate-pref-originalside"
    ></checkbox>
  </hbox>
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-columngap"
      data-l10n-id="pdfaitranslate-pref-columngap"
      style="min-width: 11em;"
    ></html:label>
    <html:input
      type="number"
      min="0"
      max="96"
      id="zotero-prefpane-__addonRef__-columngap"
      preference="columnGapPt"
      style="width: 6em;"
    ></html:input>
    <checkbox
      id="zotero-prefpane-__addonRef__-divider"
      native="true"
      preference="drawDivider"
      data-l10n-id="pdfaitranslate-pref-divider"
      style="margin-inline-start: 16px;"
    ></checkbox>
  </hbox>
  <html:p data-l10n-id="pdfaitranslate-pref-layout-auto" style="max-width:40em;"></html:p>
</groupbox>

<groupbox>
  <label><html:h2 data-l10n-id="pdfaitranslate-pref-output"></html:h2></label>
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-outputmode"
      data-l10n-id="pdfaitranslate-pref-outputmode"
      style="min-width: 11em;"
    ></html:label>
    <menulist
      id="zotero-prefpane-__addonRef__-outputmode"
      native="true"
      preference="outputMode"
      oncommand="Zotero.__addonInstance__.hooks.onPrefsEvent('outputChanged', { window })"
      style="min-width: 22em;"
    >
      <menupopup>
        <menuitem
          value="same-dir"
          data-l10n-attrs="label"
          data-l10n-id="pdfaitranslate-pref-outputmode-samedir"
        />
        <menuitem
          value="custom"
          data-l10n-attrs="label"
          data-l10n-id="pdfaitranslate-pref-outputmode-custom"
        />
        <menuitem
          value="storage"
          data-l10n-attrs="label"
          data-l10n-id="pdfaitranslate-pref-outputmode-storage"
        />
      </menupopup>
    </menulist>
  </hbox>
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-customdir"
      data-l10n-id="pdfaitranslate-pref-customdir"
      style="min-width: 11em;"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-customdir"
      preference="customOutputDir"
      style="min-width: 26em;"
    ></html:input>
    <button
      label="…"
      oncommand="Zotero.__addonInstance__.hooks.onPrefsEvent('pickDir', { window })"
    />
  </hbox>
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-suffix"
      data-l10n-id="pdfaitranslate-pref-suffix"
      style="min-width: 11em;"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-suffix"
      preference="suffix"
      style="min-width: 16em;"
    ></html:input>
    <checkbox
      id="zotero-prefpane-__addonRef__-overwrite"
      native="true"
      preference="overwrite"
      data-l10n-id="pdfaitranslate-pref-overwrite"
      style="margin-inline-start: 16px;"
    ></checkbox>
  </hbox>
  <checkbox native="true"
    id="zotero-prefpane-__addonRef__-attachment"
    preference="addAsAttachment"
    data-l10n-id="pdfaitranslate-pref-attachment"
  />
  <checkbox native="true"
    id="zotero-prefpane-__addonRef__-open"
    preference="openAfterExport"
    data-l10n-id="pdfaitranslate-pref-open"
  />
  <checkbox native="true"
    id="zotero-prefpane-__addonRef__-reveal"
    preference="revealAfterExport"
    data-l10n-id="pdfaitranslate-pref-reveal"
  />
</groupbox>

<groupbox>
  <label><html:h2 data-l10n-id="pdfaitranslate-pref-advanced"></html:h2></label>
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-concurrency"
      data-l10n-id="pdfaitranslate-pref-concurrency"
      style="min-width: 11em;"
    ></html:label>
    <html:input
      type="number"
      min="1"
      max="32"
      id="zotero-prefpane-__addonRef__-concurrency"
      preference="concurrency"
      style="width: 6em;"
    ></html:input>
    <html:label
      for="zotero-prefpane-__addonRef__-batchchars"
      data-l10n-id="pdfaitranslate-pref-batchchars"
      style="margin-inline-start: 16px;"
    ></html:label>
    <html:input
      type="number"
      min="200"
      max="20000"
      step="100"
      id="zotero-prefpane-__addonRef__-batchchars"
      preference="batchChars"
      style="width: 7em; margin-inline-start: 6px;"
    ></html:input>
  </hbox>
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-timeout"
      data-l10n-id="pdfaitranslate-pref-timeout"
      style="min-width: 11em;"
    ></html:label>
    <html:input
      type="number"
      min="15"
      max="900"
      id="zotero-prefpane-__addonRef__-timeout"
      preference="requestTimeoutSec"
      style="width: 6em;"
    ></html:input>
    <html:label
      for="zotero-prefpane-__addonRef__-retries"
      data-l10n-id="pdfaitranslate-pref-retries"
      style="margin-inline-start: 16px;"
    ></html:label>
    <html:input
      type="number"
      min="1"
      max="10"
      id="zotero-prefpane-__addonRef__-retries"
      preference="maxRetries"
      style="width: 5em; margin-inline-start: 6px;"
    ></html:input>
    <html:label
      for="zotero-prefpane-__addonRef__-temperature"
      data-l10n-id="pdfaitranslate-pref-temperature"
      style="margin-inline-start: 16px;"
    ></html:label>
    <html:input
      type="number"
      min="0"
      max="2"
      step="0.1"
      id="zotero-prefpane-__addonRef__-temperature"
      preference="temperature"
      style="width: 5em; margin-inline-start: 6px;"
    ></html:input>
  </hbox>
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-font"
      data-l10n-id="pdfaitranslate-pref-font"
      style="min-width: 11em;"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-font"
      preference="cjkFontPath"
      style="min-width: 24em;"
    ></html:input>
    <button
      id="zotero-prefpane-__addonRef__-fontpick"
      data-l10n-id="pdfaitranslate-pref-font-pick"
      oncommand="Zotero.__addonInstance__.hooks.onPrefsEvent('pickFont', { window })"
    />
  </hbox>
  <checkbox native="true"
    id="zotero-prefpane-__addonRef__-quality"
    preference="qualityAudit"
    data-l10n-id="pdfaitranslate-pref-quality"
  />
  <checkbox native="true"
    id="zotero-prefpane-__addonRef__-resume"
    preference="resumePartial"
    data-l10n-id="pdfaitranslate-pref-resume"
  />
  <checkbox native="true"
    id="zotero-prefpane-__addonRef__-cache"
    preference="cacheEnabled"
    data-l10n-id="pdfaitranslate-pref-cache"
  />
  <checkbox native="true"
    id="zotero-prefpane-__addonRef__-debug"
    preference="debug"
    data-l10n-id="pdfaitranslate-pref-debug"
  />
</groupbox>

<vbox>
  <html:label
    data-l10n-id="pdfaitranslate-pref-help"
    data-l10n-args='{"version":"__buildVersion__","time":"__buildTime__"}'
  ></html:label>
</vbox>
