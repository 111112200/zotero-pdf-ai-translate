<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>

<groupbox>
  <label><html:h2 data-l10n-id="pdfaitranslate-pref-service"></html:h2></label>
  <html:p
    data-l10n-id="pdfaitranslate-pref-service-desc"
    style="margin: 0 0 8px 0; opacity: 0.75; max-width: 40em;"
  ></html:p>

  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-provider"
      data-l10n-id="pdfaitranslate-pref-provider"
      style="min-width: 11em;"
    ></html:label>
    <menulist
      id="zotero-prefpane-__addonRef__-provider"
      native="true"
      preference="activeProviderId"
      oncommand="Zotero.__addonInstance__.hooks.onPrefsEvent('providerChanged', { window })"
      style="min-width: 22em;"
    >
      <menupopup id="__addonRef__-provider-popup" />
    </menulist>
  </hbox>

  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-baseurl"
      data-l10n-id="pdfaitranslate-pref-baseurl"
      style="min-width: 11em;"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-baseurl"
      preference="baseURL"
      style="min-width: 30em;"
    ></html:input>
  </hbox>

  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-apikey"
      data-l10n-id="pdfaitranslate-pref-apikey"
      style="min-width: 11em;"
    ></html:label>
    <html:input
      type="password"
      id="zotero-prefpane-__addonRef__-apikey"
      preference="apiKey"
      style="min-width: 30em;"
    ></html:input>
  </hbox>

  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-model"
      data-l10n-id="pdfaitranslate-pref-model"
      style="min-width: 11em;"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-model"
      preference="model"
      style="min-width: 30em;"
    ></html:input>
    <button
      id="zotero-prefpane-__addonRef__-test"
      data-l10n-id="pdfaitranslate-pref-test"
      oncommand="Zotero.__addonInstance__.hooks.onPrefsEvent('testConnection', { window })"
    />
  </hbox>

  <vbox id="__addonRef__-test-result" style="margin-inline-start: 11em;" />
</groupbox>

<groupbox>
  <label><html:h2 data-l10n-id="pdfaitranslate-pref-language"></html:h2></label>
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-sourcelang"
      data-l10n-id="pdfaitranslate-pref-sourcelang"
      style="min-width: 11em;"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-sourcelang"
      preference="sourceLang"
      style="min-width: 10em;"
    ></html:input>
  </hbox>
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-targetlang"
      data-l10n-id="pdfaitranslate-pref-targetlang"
      style="min-width: 11em;"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-targetlang"
      preference="targetLang"
      style="min-width: 10em;"
    ></html:input>
  </hbox>
</groupbox>

<groupbox>
  <label><html:h2 data-l10n-id="pdfaitranslate-pref-layout"></html:h2></label>
  <html:p data-l10n-id="pdfaitranslate-pref-layout-auto" style="max-width:40em;"></html:p>
</groupbox>

<groupbox>
  <label><html:h2 data-l10n-id="pdfaitranslate-pref-output"></html:h2></label>
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-outputmode"
      data-l10n-id="pdfaitranslate-pref-outputmode"
      style="min-width: 11em;"
    ></html:label>
    <menulist
      id="zotero-prefpane-__addonRef__-outputmode"
      native="true"
      preference="outputMode"
      oncommand="Zotero.__addonInstance__.hooks.onPrefsEvent('outputChanged', { window })"
      style="min-width: 22em;"
    >
      <menupopup>
        <menuitem
          value="same-dir"
          data-l10n-attrs="label"
          data-l10n-id="pdfaitranslate-pref-outputmode-samedir"
        />
        <menuitem
          value="custom"
          data-l10n-attrs="label"
          data-l10n-id="pdfaitranslate-pref-outputmode-custom"
        />
        <menuitem
          value="storage"
          data-l10n-attrs="label"
          data-l10n-id="pdfaitranslate-pref-outputmode-storage"
        />
      </menupopup>
    </menulist>
  </hbox>
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-customdir"
      data-l10n-id="pdfaitranslate-pref-customdir"
      style="min-width: 11em;"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-customdir"
      preference="customOutputDir"
      style="min-width: 26em;"
    ></html:input>
    <button
      label="…"
      oncommand="Zotero.__addonInstance__.hooks.onPrefsEvent('pickDir', { window })"
    />
  </hbox>
  <checkbox
    id="zotero-prefpane-__addonRef__-attachment"
    preference="addAsAttachment"
    data-l10n-id="pdfaitranslate-pref-attachment"
  />
  <checkbox
    id="zotero-prefpane-__addonRef__-open"
    preference="openAfterExport"
    data-l10n-id="pdfaitranslate-pref-open"
  />
</groupbox>

<groupbox>
  <label><html:h2 data-l10n-id="pdfaitranslate-pref-advanced"></html:h2></label>
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-concurrency"
      data-l10n-id="pdfaitranslate-pref-concurrency"
      style="min-width: 11em;"
    ></html:label>
    <html:input
      type="number"
      min="1"
      max="32"
      id="zotero-prefpane-__addonRef__-concurrency"
      preference="concurrency"
      style="width: 6em;"
    ></html:input>
  </hbox>
  <checkbox
    id="zotero-prefpane-__addonRef__-cache"
    preference="cacheEnabled"
    data-l10n-id="pdfaitranslate-pref-cache"
  />
  <checkbox
    id="zotero-prefpane-__addonRef__-debug"
    preference="debug"
    data-l10n-id="pdfaitranslate-pref-debug"
  />
</groupbox>

<vbox>
  <html:label
    data-l10n-id="pdfaitranslate-pref-help"
    data-l10n-args='{"version":"__buildVersion__","time":"__buildTime__"}'
  ></html:label>
</vbox>
